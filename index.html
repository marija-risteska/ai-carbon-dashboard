<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Energy & Carbon Tool</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Unique Navy, Teal, & Warm Amber Palette */
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --brand-primary: #0284c7; /* Vibrant Cyan/Blue */
      --brand-secondary: #0d9488; /* Teal */
      --accent-warm: #f59e0b; /* Amber/Orange */
      --border-color: #e2e8f0;
      
      --alert-green-bg: #f0fdf4;
      --alert-green-border: #bbf7d0;
      --alert-green-text: #166534;
      
      --alert-red-bg: #fff1f2;
      --alert-red-border: #fecdd3;
      --alert-red-text: #9f1239;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header Section */
    header {
      margin-bottom: 2rem;
      text-align: left;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
      margin-top: 0.25rem;
    }

    /* Top Grid: Cards */
    .top-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
    }

    .card-title {
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .card-value {
      font-size: 1.875rem;
      font-weight: 800;
      color: #0f172a;
    }

    .card-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* Main Grid: Controls + Chart */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 1.5rem;
    }

    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Sliders Form */
    .slider-group {
      margin-bottom: 1.25rem;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
    }

    .slider-label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-main);
    }

    .slider-value {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--brand-primary);
      background: #f0f9ff;
      padding: 0.1rem 0.5rem;
      border-radius: 6px;
    }

    .slider-desc {
      font-size: 0.775rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 5px;
      background: #e2e8f0;
      outline: none;
      accent-color: var(--brand-primary);
      cursor: pointer;
    }

    /* Status Banner */
    .status-banner {
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1.25rem;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .status-banner.success {
      background-color: var(--alert-green-bg);
      border: 1px solid var(--alert-green-border);
      color: var(--alert-green-text);
    }

    .status-banner.warning {
      background-color: var(--alert-red-bg);
      border: 1px solid var(--alert-red-border);
